name: Deploy Eleventy to Artera

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Eleventy Site
        run: npm run build

      - name: Deploy via SFTP to Artera
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.ARTERA_HOST }}
          username: ${{ secrets.ARTERA_USER }}
          password: ${{ secrets.ARTERA_PASSWORD }}
          local-dir: ./_site/
          server-dir: /
          protocol: sftp
          exclude: |
            **/.git*
            **/.git/**
            **/node_modules/**
            .DS_Store
            **/.eleventy.js
            **/package.json
            **/src/**
